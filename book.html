<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="book.css">
    <title>BOOKING</title>
</head>
<body>
    <nav>
        <a href="index.html" class="back">BACK</a>
    </nav>
    <div class="box">
        <span class="tag">RESERVATIONS</span>
        <span class="heading">Book Your Journey</span>
        <span class="sub">Fill in the details below to secure your expedition itinerary.</span><br><br>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your Name"><br><br>
        <label>City of Residence</label>
        <input type="text" placeholder="Enter your City"><br><br>
        <label>Email ID</label>
        <input type="mail" placeholder="Enter your Email ID"><br><br>
        <label>Phone Number</label>
        <input type="tel" placeholder="+91 ----- ----- "><br><br>
        <label>Travel Destination</label>
        <input type="text" placeholder="Enter your Destination"><br><br>
        <label>Date of Travel</label>
        <input type="date"><br><br>
        <label>No . of People</label>
        <input type="number" min="1" max="50" placeholder="1"><br><br>
        <label>Vacation</label>
        <select>
            <option>Select vacation type</option>
            <option>Solo Trek & Expedition</option>
            <option>Guided Group Exploration</option>
            <option>Cultural Immersion</option>
            <option>Eco & Wilderness Retreat</option>
        </select><br><br>
        <button type="button" class="submit">SUMBIT BOOKING</button>
    </div>
</body>
</html>
